# Fundamental Growth Strategy / 基本面成长

name: fundamental_growth
display_name: 基本面成长
description: 筛选营收/净利润增速高、PEG低、ROE高的优质成长股，适合中长期持仓。
category: fundamental
core_rules: [1, 2, 3]
